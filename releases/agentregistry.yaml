---
apiVersion: v1
kind: Namespace
metadata:
  name: agentregistry
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: agentregistry-inventory
  namespace: flux-system
spec:
  interval: 1h
  url: https://github.com/den-vasyliev/agentregistry-inventory
  ref:
    branch: main
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agentregistry
  namespace: agentregistry
spec:
  interval: 5m
  chart:
    spec:
      chart: ./charts/agentregistry
      sourceRef:
        kind: GitRepository
        name: agentregistry-inventory
        namespace: flux-system
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    disableAuth: true
---
# ----------------------------------------------------------
# Enable discovery of agents in the "kagent" namespace
# ----------------------------------------------------------
apiVersion: agentregistry.dev/v1alpha1
kind: DiscoveryConfig
metadata:
  name: abox
  namespace: agentregistry
spec:
  environments:
  - name: abox
    cluster:
      name: local
    namespaces: [kagent]
    discoveryEnabled: true
---
# ----------------------------------------------------------
# Access via http://agentregistry.172.20.0.5.nip.io
# ----------------------------------------------------------
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentregistry
  namespace: agentregistry
spec:
  parentRefs:
  - name: agentgateway-external
    namespace: agentgateway-system
  hostnames:
  - agentregistry.172.20.0.5.nip.io
  rules:
  - backendRefs:
    - name: agentregistry-api
      port: 8080
