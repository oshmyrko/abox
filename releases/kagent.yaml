apiVersion: v1
kind: Namespace
metadata:
  name: kagent
---
# apiVersion: source.toolkit.fluxcd.io/v1
# kind: OCIRepository
# metadata:
#   name: kagent
#   namespace: flux-system
# spec:
#   interval: 1h
#   url: oci://ghcr.io/kagent-dev/kagent/helm/kagent
#   ref:
#     tag: "0.9.4"

# Switching to HelmRepository as OCIRepository has an issue with deployment,
# specifically it gets wrong version
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kagent
  namespace: flux-system
spec:
  interval: 5m
  type: oci
  url: oci://ghcr.io/kagent-dev/kagent/helm
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kagent
  namespace: kagent
spec:
  chart:
    spec:
      interval: 1h
      chart: kagent
      version: 0.9.4
      sourceRef:
        kind: HelmRepository
        name: kagent
        namespace: flux-system
  interval: 1m
  releaseName: kagent
  dependsOn:
  - name: kagent-crds
    namespace: kagent
  install:
    createNamespace: true
  values:
    tag: 0.9.4
    controller:
      image:
        tag: 0.9.4
    ui:
      image:
        tag: 0.9.4
    # Agents
    argo-rollouts-agent:
      enabled: false
    helm-agent:
      enabled: false
    cilium-policy-agent:
      enabled: false
    cilium-manager-agent:
      enabled: false
    cilium-debug-agent:
      enabled: false
    istio-agent:
      enabled: false
    #observability-agent:
    #  enabled: false
    #promql-agent:
    #  enabled: false
    # MCP Tools
    #grafana-mcp:
    #  enabled: false
    querydoc:
      enabled: false
    # Provider configuration
    providers:
      default: gemini
      gemini:
        provider: Gemini
        model: gemini-2.5-flash-lite
        apiKeySecretRef: kagent-gemini-api-key
        apiKeySecretKey: GEMINI_API_KEY
        #apiKey: DEFAULT_GEMINI_API_KEY_STUB
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: kagent
  namespace: kagent
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: kagent
  to:
  - group: ""
    kind: Service
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kagent
  namespace: kagent
spec:
  parentRefs:
  - name: agentgateway-external
    namespace: agentgateway-system
  hostnames:
  - kagent.172.20.0.5.nip.io
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api
    backendRefs:
    - name: kagent-controller
      namespace: kagent
      port: 8083
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: kagent-ui
      namespace: kagent
      port: 8080
